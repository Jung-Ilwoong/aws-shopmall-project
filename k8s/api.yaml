apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopmall-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopmall-api
  template:
    metadata:
      labels:
        app: shopmall-api
    spec:
      containers:
        - name: api
          image: 092042969614.dkr.ecr.ap-northeast-2.amazonaws.com/shopmall-app:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: shopmall-secrets
          env:
            - name: S3_UPLOADS_BUCKET
              value: "shopmall-uploads-092042969614"
            - name: UPLOADS_CLOUDFRONT_DOMAIN
              # apply할 때마다 CloudFront 도메인이 새로 발급되므로 여기 값은 항상 플레이스홀더.
              # 실제 값은 CI(deploy.yml)가 배포 직후 kubectl set env로 덮어씀.
              value: "REPLACE_ME_AT_DEPLOY_TIME"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: shopmall-api
  labels:
    app: shopmall-api
spec:
  type: NodePort
  selector:
    app: shopmall-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shopmall-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shopmall-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
