apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: shopmall-secrets-provider
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "shopmall/app-secrets"
        objectType: "secretsmanager"
        jmesPath:
          - path: DB_HOST
            objectAlias: DB_HOST
          - path: DB_PORT
            objectAlias: DB_PORT
          - path: DB_USER
            objectAlias: DB_USER
          - path: DB_PASSWORD
            objectAlias: DB_PASSWORD
          - path: DB_NAME
            objectAlias: DB_NAME
          - path: JWT_SECRET
            objectAlias: JWT_SECRET
          - path: ANTHROPIC_API_KEY
            objectAlias: ANTHROPIC_API_KEY
  # 여기서 만들어지는 게 이전 k8s/api-secret.yaml을 대체하는 shopmall-secrets Secret.
  # 값 자체는 이 파일 어디에도 없고, 파드가 뜰 때 IAM(IRSA) 권한으로 Secrets Manager에서
  # 직접 가져와서 채워짐.
  secretObjects:
    - secretName: shopmall-secrets
      type: Opaque
      data:
        - objectName: DB_HOST
          key: DB_HOST
        - objectName: DB_PORT
          key: DB_PORT
        - objectName: DB_USER
          key: DB_USER
        - objectName: DB_PASSWORD
          key: DB_PASSWORD
        - objectName: DB_NAME
          key: DB_NAME
        - objectName: JWT_SECRET
          key: JWT_SECRET
        - objectName: ANTHROPIC_API_KEY
          key: ANTHROPIC_API_KEY
